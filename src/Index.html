<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 10px; }
      textarea { width: 100%; height: 350px; font-family: monospace; font-size: 11px; margin-bottom: 10px; }
      button { background-color: #0F9D58; color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; }
      #status { margin-top: 10px; font-weight: bold; }
      a.success-link { color: #0073e6; text-decoration: underline; margin-left: 10px; }
    </style>
  </head>
  <body>
    <!-- Dynamically set the label based on the mode -->
    <label><b>Paste your <?!= mode === 'slides' ? 'CSA Deck JSON' : 'Lucidchart JSON' ?> Payload:</b></label>
    <textarea id="payloadInput"></textarea>
    
    <!-- Pass the mode into the frontend JS function -->
    <button onclick="submitPayload('<?!= mode ?>')">Generate <?!= mode === 'slides' ? 'Slides' : 'Diagram' ?></button>
    <div id="status"></div>

    <script>
      function submitPayload(mode) {
        const payloadText = document.getElementById('payloadInput').value;
        const statusDiv = document.getElementById('status');
        
        if (!payloadText) {
          statusDiv.innerHTML = "<span style='color:red;'>Error: Please paste the payload.</span>";
          return;
        }

        statusDiv.innerHTML = "<span style='color:blue;'>Processing... please wait.</span>";

        // Route to the correct Apps Script function based on the mode
        if (mode === 'slides') {
          google.script.run
            .withSuccessHandler((url) => { 
              // Assumes the backend processJsonFromUi returns the URL of the new Google Slides presentation
              let linkHtml = url ? `<a href="${url}" target="_blank" class="success-link">Open CSA Deck</a>` : '';
              statusDiv.innerHTML = `<span style='color:green;'>Success! Slides generated.</span>${linkHtml}`; 
            })
            .withFailureHandler((err) => { statusDiv.innerHTML = "<span style='color:red;'>Error: " + err.message + "</span>"; })
            .processJsonFromUi(payloadText);
          } else if (mode === 'lucid') {
            google.script.run
              .withSuccessHandler((response) => { 
                // Handle the Lucid API response (update property based on actual returned JSON)
                let url = response.editUrl || response.url; 
                let linkHtml = url ? `<a href="${url}" target="_blank" class="success-link">Open Lucidchart</a>` : '';
                statusDiv.innerHTML = `<span style='color:green;'>Success! Diagram created.</span>${linkHtml}`; 
              })
              .withFailureHandler((err) => { 
                statusDiv.innerHTML = "<span style='color:red;'>Error: " + err.message + "</span>"; 
              })
              .processLucidJsonFromUi(payloadText);
          }
      }
    </script>
  </body>
</html>
