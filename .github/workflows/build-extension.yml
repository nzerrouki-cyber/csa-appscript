name: Build CSA Extension Bundle
on:
  push:
    branches: [ main ]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Root Dependencies
        run: npm install

      - name: Install Extension Dependencies
        run: |
          cd editorextensions/csa-elk-renderer
          npm install

      # Compiles editorextensions and outputs package.zip at root
      - name: Bundle Extension Package
        run: npx lucid-package bundle

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: csa-bundle
          path: package.zip
          if-no-files-found: error