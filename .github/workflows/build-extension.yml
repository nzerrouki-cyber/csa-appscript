name: Build CSA Extension Bundle
on:
  push:
    branches: [ main ]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      # Bundles extension code and elk.bundled.js into dist/csa-lucid-bundle.zip
      - name: Bundle Extension Package
        run: npx lucid-package bundle --out dist/csa-lucid-bundle.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: csa-bundle
          path: dist/csa-lucid-bundle.zip